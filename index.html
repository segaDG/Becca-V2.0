<html lang="id">
<head>

  <title>BECCA — Catering Management</title>
  <link rel="stylesheet" href="css/base.css"/>

  <!-- Supabase — load lebih awal, non-blocking -->

<body>
  <div id="page-login" class="login-page"></div>

    <div class="main-area">

      <main id="content" class="content">

        <section id="page-task"      class="page"></section>
        <section id="page-report"    class="page"></section>
        <section id="page-settings"  class="page"></section>
      </main>
    </div>
  </div>
  <div id="sidebar-overlay"></div>
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>

  <!-- Core (sync — harus ada sebelum modules) -->
  <script src="js/utils.js?v=20260326b"></script>

  <script src="js/db-patch.js?v=20260326b"></script>
  <script src="js/auth.js?v=20260326b"></script>

  <script src="js/ui/sidebar.js?v=20260326b"          defer></script>
  <script src="js/modules/dashboard.js?v=20260326b"   defer></script>
  <script src="js/modules/order.js?v=20260326b"       defer></script>
  <script src="js/modules/invoice.js?v=20260326b"     defer></script>
  <script src="js/modules/customer.js?v=20260326b"    defer></script>
  <script src="js/modules/kas.js?v=20260326b"         defer></script>
  <script src="js/modules/inventory.js?v=20260326b"   defer></script>

  <script src="js/modules/ap.js?v=20260326b"          defer></script>
  <script src="js/modules/task.js?v=20260326b"        defer></script>

  <script src="js/modules/settings.js?v=20260326b"    defer></script>
  <script src="js/notifications.js?v=20260326b"       defer></script>
  <script src="js/search-fix.js?v=20260326b"          defer></script>

  <!-- Boot — terakhir, tunggu semua modules -->
  <script src="js/app.js?v=20260326b"                 defer></script>

</html>
