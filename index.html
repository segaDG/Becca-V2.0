<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BECCA — Catering Management</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#6366f1"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="BECCA"/>
  <link rel="apple-touch-icon" href="/img/logo-bps.png"/>

  <!-- Preconnect ke domain eksternal untuk mempercepat DNS + TLS -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
  <link rel="preconnect" href="https://pevwkyrsfpmzhwxkoask.supabase.co" crossorigin/>
  <link rel="stylesheet" href="css/base.css?v=20260404x"/>
  <link rel="stylesheet" href="css/layout.css?v=20260404x"/>
  <link rel="stylesheet" href="css/components.css?v=20260404x"/>
  <link rel="stylesheet" href="css/tables.css?v=20260404x"/>
  <!-- Supabase SDK — async agar tidak block parse HTML.
       db.js._initClient() sudah punya dynamic fallback jika belum tersedia. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" async></script>
</head>
<body>
  <!-- Loading screen — tampil instantly sebelum JS selesai -->
  <div id="app-loading" style="position:fixed;inset:0;background:#0f1117;display:flex;
    flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px">
    <div style="width:44px;height:44px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
      border-radius:12px;display:flex;align-items:center;justify-content:center;
      font-size:22px;font-weight:900;color:white;font-family:sans-serif">B</div>
    <div style="font-family:sans-serif;font-size:13px;color:#6b7280;letter-spacing:.05em">Memuat…</div>
    <div style="width:160px;height:3px;background:#1f2937;border-radius:999px;overflow:hidden">
      <div style="height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);
        border-radius:999px;animation:becca-load 1.4s ease-in-out infinite"></div>
    </div>
  </div>
  <style>
    @keyframes becca-load {
      0%   { width:0%;   margin-left:0 }
      50%  { width:70%;  margin-left:15% }
      100% { width:0%;   margin-left:100% }
    }
  </style>

  <div id="page-login" class="login-page"></div>
  <div id="app" style="display:none">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header id="header" class="header"></header>
      <main id="content" class="content">
        <section id="page-dashboard" class="page"></section>
        <section id="page-order"     class="page"></section>
        <section id="page-invoice"   class="page"></section>
        <section id="page-customer"  class="page"></section>
        <section id="page-news"     class="page"></section>
        <section id="page-kas"       class="page"></section>
        <section id="page-daily-order" class="page"></section>
        <section id="page-inventory" class="page"></section>
        <section id="page-employee"  class="page"></section>
        <section id="page-ap"        class="page"></section>
        <section id="page-po"        class="page"></section>
        <section id="page-task"      class="page"></section>
        <section id="page-menu"      class="page"></section>
        <section id="page-delivery"  class="page"></section>
        <section id="page-chat"      class="page"></section>
        <section id="page-personal"  class="page"></section>
        <section id="page-report"    class="page"></section>
        <section id="page-settings"  class="page"></section>
      </main>
    </div>
  </div>
  <div id="sidebar-overlay"></div>
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>

  <!-- Core — defer supaya tidak block render HTML, execute in-order sebelum DOMContentLoaded -->
  <script src="js/utils.js?v=20260404x"               defer></script>
  <script src="js/utils-extensions.js?v=20260404z"    defer></script>
  <script src="js/db.js?v=20260424a"                  defer></script>
  <script src="js/db-extensions.js?v=20260410a"       defer></script>
  <script src="js/db-patch.js?v=20260424a"            defer></script>
  <script src="js/auth.js?v=20260404x"                defer></script>
  <script src="js/ui/notify.js?v=20260404x"           defer></script>
  <script src="js/ui/modal.js?v=20260404x"            defer></script>
  <script src="js/ui/sidebar.js?v=20260404x"          defer></script>

  <!-- Firebase SDK (untuk push notification) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js" defer></script>

  <!-- Utility modules — always loaded -->
  <script src="js/push.js?v=20260404x"                    defer></script>
  <script src="js/media-picker.js?v=20260404x"            defer></script>
  <script src="js/undo-redo.js?v=20260404x"                defer></script>
  <script src="js/grid-select.js?v=20260404x"             defer></script>
  <script src="js/modules/face-attendance.js?v=20260404x" defer></script>

  <!-- Boot — modules dimuat lazily saat navigate ke halaman tersebut -->
  <script src="js/tests.js?v=20260424b"               defer></script>
  <script src="js/app.js?v=20260424a"                 defer></script>

  <!-- PWA: daftarkan Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
