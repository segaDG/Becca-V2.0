<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BECCA — Catering Management</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/tables.css"/>
</head>
<body>
  <div id="page-login" class="login-page"></div>
  <div id="app" style="display:none">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header id="header" class="header"></header>
      <main id="content" class="content">
        <section id="page-dashboard" class="page"></section>
        <section id="page-order"     class="page"></section>
        <section id="page-invoice"   class="page"></section>
        <section id="page-customer"  class="page"></section>
        <section id="page-kas"       class="page"></section>
        <section id="page-inventory" class="page"></section>
        <section id="page-employee"  class="page"></section>
        <section id="page-ap"        class="page"></section>
        <section id="page-task"      class="page"></section>
        <section id="page-report"    class="page"></section>
        <section id="page-settings"  class="page"></section>
      </main>
    </div>
  </div>
  <div id="sidebar-overlay"></div>
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>

  <!-- Core -->
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <!-- UI -->
  <script src="js/ui/notify.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <!-- Modules -->
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/order.js"></script>
  <script src="js/modules/invoice.js"></script>
  <script src="js/modules/customer.js"></script>
  <script src="js/modules/kas.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/employee.js"></script>
  <script src="js/modules/ap.js"></script>
  <script src="js/modules/task.js"></script>
  <script src="js/modules/report.js"></script>
  <script src="js/modules/settings.js"></script>
  <!-- Notifications -->
  <script src="js/notifications.js"></script>
  <!-- Boot -->
  <script src="js/app.js"></script>
</body>
</html>
