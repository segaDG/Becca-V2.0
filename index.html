<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BECCA — Catering Management</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/tables.css"/>
  <!-- Supabase — load lebih awal, non-blocking -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="page-login" class="login-page"></div>
  <div id="app" style="display:none">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header id="header" class="header"></header>
      <main id="content" class="content">
        <section id="page-dashboard" class="page"></section>
        <section id="page-order"     class="page"></section>
        <section id="page-invoice"   class="page"></section>
        <section id="page-customer"  class="page"></section>
        <section id="page-kas"       class="page"></section>
        <section id="page-inventory" class="page"></section>
        <section id="page-employee"  class="page"></section>
        <section id="page-ap"        class="page"></section>
        <section id="page-task"      class="page"></section>
        <section id="page-report"    class="page"></section>
        <section id="page-settings"  class="page"></section>
      </main>
    </div>
  </div>
  <div id="sidebar-overlay"></div>
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-root"></div>

  <!-- Core (sync — harus ada sebelum modules) -->
  <script src="js/utils.js"></script>
  <script src="js/utils-extensions.js"></script>
  <script src="js/db.js"></script>
  <script src="js/db-extensions.js"></script>
  <script src="js/db-patch.js"></script>
  <script src="js/auth.js"></script>

  <!-- UI + Modules (defer — tidak block render) -->
  <script src="js/ui/notify.js"           defer></script>
  <script src="js/ui/modal.js"            defer></script>
  <script src="js/ui/sidebar.js"          defer></script>
  <script src="js/modules/dashboard.js"   defer></script>
  <script src="js/modules/order.js"       defer></script>
  <script src="js/modules/invoice.js"     defer></script>
  <script src="js/modules/customer.js"    defer></script>
  <script src="js/modules/kas.js"         defer></script>
  <script src="js/modules/inventory.js"   defer></script>
  <script src="js/modules/employee.js"    defer></script>
  <script src="js/modules/ap.js"          defer></script>
  <script src="js/modules/task.js"        defer></script>
  <script src="js/modules/report.js"      defer></script>
  <script src="js/modules/settings.js"    defer></script>
  <script src="js/notifications.js"       defer></script>
  <script src="js/search-fix.js"          defer></script>

  <!-- Boot — terakhir, tunggu semua modules -->
  <script src="js/app.js"                 defer></script>
</body>
</html>
