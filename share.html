<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph — WhatsApp / Social Preview -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="BECCA">
  <meta property="og:title"       content="📋 Task dari BECCA">
  <meta property="og:description" content="Ada task baru untukmu! Klik untuk melihat detail dan mulai kerjakan di BECCA.">
  <meta property="og:image"       content="https://segaDG.github.io/Becca-V2.0/img/og-becca.svg">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="📋 Task dari BECCA">
  <meta name="twitter:description" content="Ada task baru untukmu! Klik untuk melihat detail.">
  <meta name="twitter:image"       content="https://segaDG.github.io/Becca-V2.0/img/og-becca.svg">

  <title>BECCA Task</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .wrap { width: 100%; max-width: 440px; }

    /* Brand header */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .brand-logo {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 900; color: #fff;
      flex-shrink: 0;
    }
    .brand-name { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
    .brand-sub  { font-size: 11px; color: #64748b; margin-top: 1px; }

    /* Card */
    .card {
      background: #1e293b;
      border-radius: 20px;
      border: 1px solid #334155;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }
    .card-header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-header-icon { font-size: 26px; }
    .card-header-label {
      font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: rgba(255,255,255,.75);
    }

    .card-body { padding: 24px; }

    .task-title {
      font-size: 20px; font-weight: 800; line-height: 1.3;
      color: #f1f5f9; margin-bottom: 10px;
    }
    .task-desc {
      font-size: 13px; color: #94a3b8; line-height: 1.6;
      margin-bottom: 20px;
    }

    /* Meta grid */
    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 24px;
    }
    .meta-item {
      background: #0f172a; border-radius: 10px; padding: 12px 14px;
    }
    .meta-label {
      font-size: 9px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: #475569; margin-bottom: 5px;
    }
    .meta-value { font-size: 13px; font-weight: 600; color: #e2e8f0; }

    /* Priority colors */
    .p-high   { color: #f87171; }
    .p-medium { color: #fbbf24; }
    .p-low    { color: #4ade80; }

    /* Status badges */
    .s-badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .s-todo       { background: rgba(100,116,139,.25); color: #94a3b8; }
    .s-inprogress { background: rgba(59,130,246,.2);   color: #60a5fa; }
    .s-review     { background: rgba(245,158,11,.2);   color: #fbbf24; }
    .s-done       { background: rgba(34,197,94,.2);    color: #4ade80; }
    .s-arsip      { background: rgba(100,116,139,.15); color: #64748b; }

    /* CTA */
    .btn-open {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 15px 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
    }
    .btn-open:active { opacity: .85; transform: scale(.98); }

    .login-note {
      text-align: center; font-size: 11px; color: #475569;
      margin-top: 12px; line-height: 1.5;
    }

    /* Expired / not found state */
    .not-found {
      text-align: center; padding: 48px 24px; color: #64748b;
    }
    .not-found .icon { font-size: 48px; margin-bottom: 12px; }
    .not-found p { font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="brand-logo">B</div>
      <div>
        <div class="brand-name">BECCA</div>
        <div class="brand-sub">Catering Management System</div>
      </div>
    </div>

    <div class="card" id="card">
      <div class="card-header">
        <div class="card-header-icon">📋</div>
        <div class="card-header-label">Task Assignment</div>
      </div>
      <div class="card-body">
        <div class="task-title" id="task-title">Memuat…</div>
        <div class="task-desc"  id="task-desc"></div>
        <div class="meta-grid"  id="meta-grid"></div>
        <a class="btn-open" id="btn-open" href="#">
          <span>Buka di BECCA</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               width="16" height="16">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
        <div class="login-note">🔒 Login diperlukan untuk membuka task</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];

      function fmtDate(iso) {
        if (!iso) return '';
        const [y, m, d] = iso.split('-');
        return parseInt(d, 10) + ' ' + MONTHS[parseInt(m, 10) - 1] + ' ' + y;
      }

      const p = new URLSearchParams(location.search);
      const id       = p.get('id')   || '';
      const title    = p.get('t')    || '';
      const desc     = p.get('desc') || '';
      const status   = p.get('s')    || 'todo';
      const priority = p.get('p')    || 'medium';
      const assignee = p.get('a')    || '';
      const deadline = p.get('d')    || '';

      if (!id && !title) {
        document.getElementById('card').innerHTML =
          '<div class="not-found"><div class="icon">🔍</div>' +
          '<p>Link task tidak valid atau sudah kadaluarsa.</p></div>';
        return;
      }

      // Update page title for browser tab
      document.title = (title || 'Task') + ' — BECCA';

      // Title
      document.getElementById('task-title').textContent = title || '(Tanpa judul)';

      // Description
      const descEl = document.getElementById('task-desc');
      if (desc) { descEl.textContent = desc; } else { descEl.style.display = 'none'; }

      // Maps
      const STATUS_LBL = { todo:'To Do', inprogress:'In Progress', review:'Review', done:'Done', arsip:'Arsip' };
      const STATUS_CLS = { todo:'s-todo', inprogress:'s-inprogress', review:'s-review', done:'s-done', arsip:'s-arsip' };
      const PRIO_LBL   = { high:'🔴 High', medium:'🟡 Medium', low:'🟢 Low' };
      const PRIO_CLS   = { high:'p-high', medium:'p-medium', low:'p-low' };

      // Meta grid items
      const items = [];
      items.push({
        label: 'Status',
        value: `<span class="s-badge ${STATUS_CLS[status] || 's-todo'}">${STATUS_LBL[status] || status}</span>`
      });
      items.push({
        label: 'Priority',
        value: `<span class="${PRIO_CLS[priority] || 'p-medium'}">${PRIO_LBL[priority] || priority}</span>`
      });
      if (assignee) items.push({ label: 'Assignee', value: assignee });
      if (deadline)  items.push({ label: 'Deadline', value: fmtDate(deadline) });

      document.getElementById('meta-grid').innerHTML = items.map(function (m) {
        return '<div class="meta-item">' +
          '<div class="meta-label">' + m.label + '</div>' +
          '<div class="meta-value">'  + m.value + '</div>' +
          '</div>';
      }).join('');

      // Deep link to app
      const base   = location.origin + location.pathname.replace(/[^/]*$/, '');
      const appUrl = base + 'index.html?task=' + encodeURIComponent(id);
      document.getElementById('btn-open').href = appUrl;
    })();
  </script>
</body>
</html>
